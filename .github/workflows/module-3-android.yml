name: Module 3 Android

on:
  workflow_dispatch:
  
  pull_request:
    paths:
      - "module-3-executorch-on-android-semantic-segmentation/android/**"
      - ".github/workflows/module-3-android.yml"
  push:
    branches:
      - main
    paths:
      - "module-3-executorch-on-android-semantic-segmentation/android/**"
      - ".github/workflows/module-3-android.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: module-3-executorch-on-android-semantic-segmentation/android/ObjectCutout

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build and lint
        run: ./gradlew :app:assembleDebug :app:lintDebug --no-daemon
